<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TSC Brain</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Coaching modal -->
  <div id="coachingModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4" style="background:rgba(5,10,21,0.85);backdrop-filter:blur(6px);">
    <div class="glass rounded-2xl w-full max-w-lg shadow-2xl flex flex-col" style="max-height:90vh;">
      <div class="flex items-center justify-between px-5 py-4 border-b border-brand/20">
        <div class="flex items-center gap-2">
          <svg class="w-4 h-4 text-brand-light" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          <span class="text-sm font-semibold text-slate-200">Salva analisi nel Brain</span>
        </div>
        <button onclick="closeCoachingModal()" class="text-slate-500 hover:text-slate-300 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="flex-1 overflow-y-auto px-5 py-4 space-y-4">
        <div>
          <label class="text-xs text-slate-400 uppercase tracking-widest font-semibold mb-1.5 block">Audio della call</label>
          <label for="coachingAudio" class="flex items-center gap-3 cursor-pointer border border-slate-700 hover:border-brand rounded-xl px-4 py-3 transition-all">
            <svg class="w-5 h-5 text-slate-500 flex-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4M12 3a4 4 0 014 4v4a4 4 0 01-8 0V7a4 4 0 014-4z"/></svg>
            <span id="coachingAudioName" class="text-sm text-slate-500">Seleziona file audio...</span>
          </label>
          <input type="file" id="coachingAudio" accept=".mp3,.mp4,.m4a,.wav,.webm,.ogg,.flac" class="hidden" onchange="onCoachingAudioChange(this)"/>
        </div>
        <div>
          <label class="text-xs text-slate-400 uppercase tracking-widest font-semibold mb-1.5 block">Titolo <span class="text-slate-600 normal-case font-normal">(opzionale)</span></label>
          <input id="coachingTitle" type="text" placeholder="Lascia vuoto per titolo auto-generato"
            class="w-full bg-navy-950 border border-slate-700 glow-input rounded-xl px-4 py-2.5 text-sm text-slate-200 placeholder-slate-600 transition-all"/>
        </div>
        <div>
          <label class="text-xs text-slate-400 uppercase tracking-widest font-semibold mb-1.5 block">La tua analisi <span class="text-red-400">*</span></label>
          <textarea id="coachingAnalysis" rows="8" placeholder="Scrivi qui la tua analisi: cosa è andato bene, cosa è andato male, errori specifici, come avrebbe dovuto essere gestita..."
            class="w-full bg-navy-950 border border-slate-700 glow-input rounded-xl px-4 py-3 text-sm text-slate-200 placeholder-slate-600 transition-all resize-none leading-relaxed"></textarea>
        </div>
        <div id="coachingStatus" class="hidden text-xs text-brand-light flex items-center gap-2">
          <div class="flex gap-1"><div class="w-1.5 h-1.5 rounded-full bg-brand-light dot-1"></div><div class="w-1.5 h-1.5 rounded-full bg-brand-light dot-2"></div><div class="w-1.5 h-1.5 rounded-full bg-brand-light dot-3"></div></div>
          <span id="coachingStatusText">Elaborazione in corso...</span>
        </div>
        <div id="coachingSuccess" class="hidden p-3 bg-green-900/20 border border-green-500/30 rounded-xl text-sm text-green-400"></div>
        <div id="coachingError" class="hidden p-3 bg-red-900/20 border border-red-500/30 rounded-xl text-sm text-red-400"></div>
      </div>
      <div class="px-5 py-4 border-t border-brand/20">
        <button id="coachingSaveBtn" onclick="submitCoaching()" class="btn-send w-full text-white py-3 rounded-xl disabled:opacity-40 disabled:cursor-not-allowed text-sm font-semibold">
          Salva nel Brain
        </button>
      </div>
    </div>
  </div>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: { 950: '#050a15', 900: '#080f1e', 800: '#0d1929', 700: '#112038' },
            brand: { light: '#38bef8', DEFAULT: '#1a6fd4', dark: '#1252a3' }
          },
          fontFamily: { sans: ['Montserrat', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    body { background-color: #080f1e; }
    .glass {
      background: rgba(13, 25, 41, 0.85);
      border: 1px solid rgba(26, 111, 212, 0.2);
      backdrop-filter: blur(10px);
    }
    .glow-input:focus {
      outline: none;
      border-color: #1a6fd4;
      box-shadow: 0 0 0 3px rgba(26, 111, 212, 0.2);
    }
    .btn-send {
      background: linear-gradient(135deg, #1a6fd4, #1252a3);
      transition: all 0.2s;
    }
    .btn-send:hover:not(:disabled) {
      background: linear-gradient(135deg, #38bef8, #1a6fd4);
      box-shadow: 0 0 20px rgba(26, 111, 212, 0.4);
    }
    .header-line {
      height: 2px;
      background: linear-gradient(90deg, transparent, #1a6fd4, #38bef8, transparent);
    }
    .prose-tsc h2 { font-size: 1rem; font-weight: 700; margin: 1.2rem 0 0.5rem; color: #38bef8; }
    .prose-tsc h3 { font-size: 0.9rem; font-weight: 700; margin: 1rem 0 0.4rem; color: #38bef8; }
    .prose-tsc ul { list-style: none; padding-left: 0; margin: 0.5rem 0; }
    .prose-tsc ul li::before { content: "→ "; color: #1a6fd4; font-weight: 700; }
    .prose-tsc ol { list-style: decimal; padding-left: 1.5rem; margin: 0.5rem 0; }
    .prose-tsc li { margin: 0.35rem 0; color: #cbd5e1; }
    .prose-tsc blockquote {
      border-left: 3px solid #1a6fd4;
      padding: 0.5rem 1rem;
      margin: 0.75rem 0;
      background: rgba(26, 111, 212, 0.08);
      border-radius: 0 6px 6px 0;
      color: #94a3b8;
      font-style: italic;
    }
    .prose-tsc p { margin: 0.5rem 0; color: #cbd5e1; line-height: 1.7; }
    .prose-tsc strong { color: #e2e8f0; font-weight: 700; }
    .prose-tsc hr { border-color: rgba(26, 111, 212, 0.2); margin: 1rem 0; }
    @keyframes dot-pulse {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1); }
    }
    .dot-1 { animation: dot-pulse 1.2s ease-in-out infinite; }
    .dot-2 { animation: dot-pulse 1.2s ease-in-out 0.4s infinite; }
    .dot-3 { animation: dot-pulse 1.2s ease-in-out 0.8s infinite; }
  </style>
</head>
<body class="font-sans h-screen flex flex-col text-slate-200 overflow-hidden">

  <div class="fixed inset-0 pointer-events-none" style="background: radial-gradient(ellipse at 20% 20%, rgba(26,111,212,0.07) 0%, transparent 60%), radial-gradient(ellipse at 80% 80%, rgba(56,190,248,0.04) 0%, transparent 60%);"></div>

  <!-- Header -->
  <header class="flex-none z-50" style="background: rgba(8,15,30,0.95); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(26,111,212,0.15);">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 py-3 sm:py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img src="/static/logo.png" alt="TSC" class="h-8 sm:h-9 w-auto object-contain" />
        <div>
          <div class="text-xs font-semibold tracking-widest text-brand-light uppercase">Knowledge Base</div>
          <div id="docCount" class="text-xs text-slate-500 mt-0.5"></div>
        </div>
      </div>
      <div class="flex items-center gap-2">
<button onclick="openCoachingModal()" class="flex items-center gap-1.5 text-xs text-brand-light hover:text-white border border-brand/40 hover:border-brand bg-brand/10 hover:bg-brand/20 px-2.5 sm:px-3 py-2 rounded-lg transition-all">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          <span class="hidden sm:inline">Salva nel Brain</span>
        </button>
        <button onclick="clearChat()" class="flex items-center gap-1.5 text-xs text-slate-400 hover:text-brand-light border border-slate-700 hover:border-brand px-2.5 sm:px-3 py-2 rounded-lg transition-all">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
          <span class="hidden sm:inline">Nuova chat</span>
        </button>
      </div>
    </div>
    <div class="header-line"></div>
  </header>

  <!-- Messages -->
  <main id="chatMain" class="flex-1 overflow-y-auto">
    <div id="chatMessages" class="max-w-3xl mx-auto px-4 sm:px-6 py-6 sm:py-8 space-y-4 sm:space-y-5">
      <div id="emptyState" class="flex flex-col items-center justify-center py-20 sm:py-28 text-slate-600">
        <div class="text-4xl sm:text-5xl mb-4 sm:mb-5">⚡</div>
        <p class="text-sm text-center leading-relaxed px-4">Chiedimi qualcosa sulla knowledge base di TSC.<br>Tecniche di vendita, procedure, sessioni di coaching.</p>
      </div>
    </div>
  </main>

  <!-- Input -->
  <div class="flex-none z-50" style="background: rgba(8,15,30,0.95); backdrop-filter: blur(12px); border-top: 1px solid rgba(26,111,212,0.15);">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 py-3 sm:py-4">
      <form id="queryForm">
        <div class="flex gap-2 sm:gap-3 items-end">
          <label for="audioInput" title="Analizza audio call"
            class="cursor-pointer flex items-center justify-center flex-none min-w-[48px] min-h-[48px] rounded-xl border border-slate-700 hover:border-brand text-slate-400 hover:text-brand-light transition-all">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4M12 3a4 4 0 014 4v4a4 4 0 01-8 0V7a4 4 0 014-4z"/></svg>
          </label>
          <input type="file" id="audioInput" accept=".mp3,.mp4,.m4a,.wav,.webm,.ogg,.flac" class="hidden" />
          <input
            id="questionInput"
            type="text"
            placeholder="Scrivi un messaggio..."
            class="flex-1 bg-navy-950 border border-slate-700 glow-input rounded-xl px-4 py-3 text-sm text-slate-200 placeholder-slate-600 transition-all"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="sentences"
          />
          <button type="submit" id="submitBtn"
            class="btn-send text-white px-4 py-3 rounded-xl disabled:opacity-40 disabled:cursor-not-allowed flex-none min-w-[48px] min-h-[48px] flex items-center justify-center">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById('queryForm');
    const input = document.getElementById('questionInput');
    const submitBtn = document.getElementById('submitBtn');
    const audioInput = document.getElementById('audioInput');
    const chatMessages = document.getElementById('chatMessages');
    const emptyState = document.getElementById('emptyState');
    const chatMain = document.getElementById('chatMain');

    let history = [];

    fetch('/api/status').then(r => r.json()).then(d => {
      document.getElementById('docCount').textContent = d.doc_count + ' sessioni indicizzate';
    });

    function scrollToBottom() {
      chatMain.scrollTop = chatMain.scrollHeight;
    }

    function esc(t) {
      return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function addUserBubble(text) {
      emptyState.style.display = 'none';
      const d = document.createElement('div');
      d.className = 'flex justify-end';
      d.innerHTML = `<div class="max-w-[80%] sm:max-w-md bg-brand rounded-2xl rounded-tr-sm px-4 py-3 text-sm text-white shadow-lg">${esc(text)}</div>`;
      chatMessages.appendChild(d);
      scrollToBottom();
    }

    function addTypingIndicator() {
      const d = document.createElement('div');
      d.id = 'typingIndicator';
      d.className = 'flex justify-start';
      d.innerHTML = `
        <div class="glass rounded-2xl rounded-tl-sm px-5 py-4 shadow-xl">
          <div class="flex gap-1.5 items-center h-4">
            <div class="w-2 h-2 rounded-full bg-brand-light dot-1"></div>
            <div class="w-2 h-2 rounded-full bg-brand-light dot-2"></div>
            <div class="w-2 h-2 rounded-full bg-brand-light dot-3"></div>
          </div>
        </div>`;
      chatMessages.appendChild(d);
      scrollToBottom();
    }

    function removeTypingIndicator() {
      const el = document.getElementById('typingIndicator');
      if (el) el.remove();
    }

    function addAnalysisBubble(filename, transcript, answer, sources) {
      let sourcesHtml = '';
      if (sources && sources.length > 0) {
        const links = sources.map(s =>
          `<a href="${s.url||'#'}" target="_blank" class="text-xs bg-navy-800 text-brand-light border border-brand/30 rounded-full px-3 py-1 hover:border-brand transition-all truncate max-w-xs">${esc(s.titolo)}</a>`
        ).join('');
        sourcesHtml = `<div class="mt-3 pt-3 border-t border-brand/10"><p class="text-xs text-slate-600 uppercase tracking-widest mb-2 font-semibold">Fonti KB</p><div class="flex flex-wrap gap-2">${links}</div></div>`;
      }
      const trId = 'tr_' + Date.now();
      const d = document.createElement('div');
      d.className = 'flex justify-start';
      d.innerHTML = `
        <div class="glass rounded-2xl rounded-tl-sm px-4 sm:px-5 py-3 sm:py-4 text-sm shadow-xl" style="max-width:92%">
          <div class="flex items-center gap-2 mb-3 pb-3 border-b border-brand/10">
            <svg class="w-4 h-4 text-brand-light flex-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4M12 3a4 4 0 014 4v4a4 4 0 01-8 0V7a4 4 0 014-4z"/></svg>
            <span class="text-xs text-brand-light font-semibold truncate">${esc(filename)}</span>
            <button onclick="document.getElementById('${trId}').classList.toggle('hidden')" class="ml-auto text-xs text-slate-500 hover:text-slate-300 border border-slate-700 rounded px-2 py-0.5 flex-none whitespace-nowrap">Trascrizione</button>
          </div>
          <div id="${trId}" class="hidden mb-3 p-3 bg-navy-950/50 rounded-lg text-xs text-slate-400 leading-relaxed max-h-40 overflow-y-auto border border-slate-700/50">${esc(transcript)}</div>
          <div class="prose-tsc leading-relaxed">${marked.parse(answer)}</div>
          ${sourcesHtml}
        </div>`;
      chatMessages.appendChild(d);
      scrollToBottom();
    }

    function addAIBubble(text, sources) {
      let sourcesHtml = '';
      if (sources && sources.length > 0) {
        const links = sources.map(s =>
          `<a href="${s.url||'#'}" target="_blank" class="text-xs bg-navy-800 text-brand-light border border-brand/30 rounded-full px-3 py-1 hover:border-brand transition-all truncate max-w-xs">${esc(s.titolo)}</a>`
        ).join('');
        sourcesHtml = `<div class="mt-3 pt-3 border-t border-brand/10"><p class="text-xs text-slate-600 uppercase tracking-widest mb-2 font-semibold">Fonti</p><div class="flex flex-wrap gap-2">${links}</div></div>`;
      }
      const d = document.createElement('div');
      d.className = 'flex justify-start';
      d.innerHTML = `
        <div class="glass rounded-2xl rounded-tl-sm px-4 sm:px-5 py-3 sm:py-4 text-sm shadow-xl" style="max-width:92%">
          <div class="prose-tsc leading-relaxed">${marked.parse(text)}</div>
          ${sourcesHtml}
        </div>`;
      chatMessages.appendChild(d);
      scrollToBottom();
    }

    function addErrorBubble(text) {
      const d = document.createElement('div');
      d.className = 'flex justify-start';
      d.innerHTML = `<div class="glass border-red-500/30 rounded-2xl rounded-tl-sm px-4 py-3 text-sm text-red-400 shadow-xl">${esc(text)}</div>`;
      chatMessages.appendChild(d);
      scrollToBottom();
    }

    function clearChat() {
      history = [];
      chatMessages.innerHTML = '';
      chatMessages.appendChild(emptyState);
      emptyState.style.display = '';
    }

    audioInput.addEventListener('change', async () => {
      const file = audioInput.files[0];
      if (!file) return;
      audioInput.value = '';

      emptyState.style.display = 'none';
      addUserBubble('🎙 ' + file.name);
      addTypingIndicator();
      submitBtn.disabled = true;

      let jobId = null;
      try {
        const fd = new FormData();
        fd.append('file', file);
        const resp = await fetch('/api/analyze-audio', { method: 'POST', body: fd });
        const startData = await resp.json();
        if (startData.error) {
          removeTypingIndicator();
          addErrorBubble(startData.error);
          submitBtn.disabled = false;
          input.focus();
          return;
        }
        jobId = startData.job_id;
      } catch {
        removeTypingIndicator();
        addErrorBubble('Errore di caricamento. Riprova.');
        submitBtn.disabled = false;
        input.focus();
        return;
      }

      let attempts = 0;
      const maxAttempts = 150;
      const poll = async () => {
        if (attempts++ >= maxAttempts) {
          removeTypingIndicator();
          addErrorBubble('Analisi troppo lunga. Riprova con un file più corto.');
          submitBtn.disabled = false;
          input.focus();
          return;
        }
        try {
          const statusResp = await fetch(`/api/analyze-status/${jobId}`);
          const data = await statusResp.json();
          if (data.status === 'pending') {
            setTimeout(poll, 2000);
            return;
          }
          removeTypingIndicator();
          if (data.status === 'error') {
            addErrorBubble(data.error || 'Errore durante l\'analisi.');
          } else {
            addAnalysisBubble(data.filename, data.transcript, data.answer, data.sources);
            history.push({ role: 'user', content: `[Analisi call: ${data.filename}]\n\nTrascrizione:\n${data.transcript}` });
            history.push({ role: 'assistant', content: data.answer });
          }
        } catch {
          removeTypingIndicator();
          addErrorBubble('Errore di connessione. Riprova.');
        }
        submitBtn.disabled = false;
        input.focus();
      };
      setTimeout(poll, 2000);
    });

    function openCoachingModal() {
      document.getElementById('coachingModal').classList.remove('hidden');
      document.getElementById('coachingSuccess').classList.add('hidden');
      document.getElementById('coachingError').classList.add('hidden');
    }

    function closeCoachingModal() {
      document.getElementById('coachingModal').classList.add('hidden');
    }

    function onCoachingAudioChange(input) {
      const name = input.files[0] ? input.files[0].name : 'Seleziona file audio...';
      document.getElementById('coachingAudioName').textContent = name;
      document.getElementById('coachingAudioName').classList.toggle('text-slate-200', !!input.files[0]);
      document.getElementById('coachingAudioName').classList.toggle('text-slate-500', !input.files[0]);
    }

    async function submitCoaching() {
      const fileInput = document.getElementById('coachingAudio');
      const analysis = document.getElementById('coachingAnalysis').value.trim();
      const title = document.getElementById('coachingTitle').value.trim();
      const saveBtn = document.getElementById('coachingSaveBtn');
      const statusEl = document.getElementById('coachingStatus');
      const statusText = document.getElementById('coachingStatusText');
      const successEl = document.getElementById('coachingSuccess');
      const errorEl = document.getElementById('coachingError');

      successEl.classList.add('hidden');
      errorEl.classList.add('hidden');

      if (!fileInput.files[0]) { errorEl.textContent = 'Seleziona un file audio.'; errorEl.classList.remove('hidden'); return; }
      if (!analysis) { errorEl.textContent = 'Scrivi la tua analisi prima di salvare.'; errorEl.classList.remove('hidden'); return; }

      saveBtn.disabled = true;
      statusEl.classList.remove('hidden');
      statusText.textContent = 'Trascrizione audio in corso...';

      try {
        const fd = new FormData();
        fd.append('file', fileInput.files[0]);
        fd.append('title', title);
        fd.append('analysis', analysis);

        statusText.textContent = 'Strutturazione analisi e salvataggio in Notion...';
        const resp = await fetch('/api/save-coaching', { method: 'POST', body: fd });
        const data = await resp.json();

        statusEl.classList.add('hidden');
        if (data.error) {
          errorEl.textContent = data.error;
          errorEl.classList.remove('hidden');
        } else {
          successEl.innerHTML = `Salvato nel Brain: <a href="${data.url}" target="_blank" class="underline font-semibold">${esc(data.titolo)}</a>`;
          successEl.classList.remove('hidden');
          fileInput.value = '';
          document.getElementById('coachingAudioName').textContent = 'Seleziona file audio...';
          document.getElementById('coachingAnalysis').value = '';
          document.getElementById('coachingTitle').value = '';
          fetch('/api/status').then(r => r.json()).then(d => {
            document.getElementById('docCount').textContent = d.doc_count + ' sessioni indicizzate';
          });
        }
      } catch {
        statusEl.classList.add('hidden');
        errorEl.textContent = 'Errore di connessione. Riprova.';
        errorEl.classList.remove('hidden');
      } finally {
        saveBtn.disabled = false;
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const question = input.value.trim();
      if (!question) return;

      input.value = '';
      submitBtn.disabled = true;
      addUserBubble(question);
      addTypingIndicator();

      try {
        const fd = new FormData();
        fd.append('question', question);
        fd.append('history', JSON.stringify(history));
        const resp = await fetch('/api/query', { method: 'POST', body: fd });
        const data = await resp.json();
        removeTypingIndicator();
        if (data.error) {
          addErrorBubble(data.error);
        } else {
          addAIBubble(data.answer, data.sources);
          history.push({ role: 'user', content: question });
          history.push({ role: 'assistant', content: data.answer });
        }
      } catch {
        removeTypingIndicator();
        addErrorBubble('Errore di connessione. Riprova.');
      } finally {
        submitBtn.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
